[project]
name = "strands-agentcore-bedrock"
version = "0.1.0"
description = "Strands Agents on Bedrock AgentCore — Support Copilot demos (Runtime, Memory, Gateway, Identity)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "bedrock-agentcore[strands-agents]>=1.22.0",
    "bedrock-agentcore-starter-toolkit>=0.3.12",
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "tavily-python>=0.5.0",
    "streamlit>=1.32.0",
    "openai>=1.40.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "_shared",
    "strands_agent",
    "strands_agent_memory",
    "strands_agent_gateway",
    "strands_agent_identity",
    "strands_support_copilot",
    "streamlit_support_app",
]
