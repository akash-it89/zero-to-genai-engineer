[project]
name = "langraph-agentcore-bedrock"
version = "0.1.0"
description = "LangGraph FAQ + research agents on Bedrock AgentCore (runtime, memory, gateway, identity, harness tools)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore>=1.22.0",
    "bedrock-agentcore-starter-toolkit>=0.2.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.4.0",
    "langchain-aws>=0.2.0",
    "langchain-openai>=1.6.0",
    "langchain[aws]>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-aws>=1.0.1",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "tavily-python>=0.5.0",
    "streamlit>=1.32.0",
    "playwright>=1.40.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "_shared",
    "langraph_agent",
    "langraph_agent_memory",
    "langraph_agent_gateway",
    "langraph_agent_identity",
    "langraph_agent_harness_tools",
    "langgraph_research_agentcore",
    "research_create_agent_agentcore",
    "langgraph_research_graph_agentcore",
    "invoke_harness_client",
    "streamlit_research_app",
]
