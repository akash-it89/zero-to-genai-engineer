[project]
name = "framework-power-agents"
version = "0.1.0"
description = "LangGraph vs Strands vs CrewAI power-agent comparison notebook"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "tavily-python>=0.5.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "crewai>=0.80.0",
    "bedrock-agentcore>=1.22.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
